[package]
name = "zcash-ffi"
version = "0.0.2"
edition = "2021"
rust-version = "1.89"
description = "Zcash FFI utilities for use by Dart."
repository = "https://git.manymath.com/sneurlax/zcash"
license = "MIT"

[lib]
name = "zcash_ffi"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "zcash-ffi"
path = "src/main.rs"

[dependencies]
serde_json = "1"
base64 = "0.22"
prost = "0.14"
hex = "0.4"
bs58 = { version = "0.5", features = ["check"] }
zcash_client_backend = { version = "0.25.0", features = ["orchard"] }
zcash_keys = { version = "0.17.0", features = ["sapling", "orchard", "transparent-inputs"] }
zcash_primitives = "0.31.0"
zcash_address = "0.14"
zcash_protocol = { version = "0.11.0", features = ["std", "local-consensus"] }
zcash_script = "0.6"
zcash_transparent = { version = "0.11", features = ["transparent-inputs"] }
zip32 = "0.3"
equihash = { version = "0.3", features = ["solver"] }
# 0.13, not 0.14: shares sha2 0.10 with the Zcash crates (0.14.1+ duplicates it).
bip0039 = { version = "0.13.4", default-features = false, features = ["std"] }

secp256k1 = { version = "0.33", optional = true }
sapling = { package = "sapling-crypto", version = "0.9", optional = true }
jubjub = { version = "0.11", optional = true }
bls12_381 = { version = "0.9", optional = true }
rand = { version = "0.10", default-features = false, features = ["sys_rng"], optional = true }
rand_core = { version = "0.10", optional = true }

rand_chacha = { version = "0.10", optional = true }

orchard = { version = "0.16.0", optional = true }

incrementalmerkletree = { version = "0.9", optional = true }

zcash_proofs = { version = "0.31", optional = true }

[features]
default = ["ironwood-note-discovery", "ironwood-tx-build"]

# Test-only: allows `rng_seed`; without it builds refuse it (`rng_seed_not_permitted`).
deterministic-build-rng = []

orchard-note-discovery = ["dep:orchard", "dep:incrementalmerkletree"]

ironwood-note-discovery = ["dep:orchard", "dep:incrementalmerkletree"]

transparent-tx-build = [
    "dep:secp256k1",
    "dep:sapling",
    "dep:jubjub",
    "dep:bls12_381",
    "dep:rand_core",
    "zcash_primitives/transparent-inputs",
    "zcash_primitives/non-standard-fees",
    "zcash_protocol/local-consensus",
]

sapling-spend-build = [
    "dep:sapling",
    "dep:rand",
    "dep:rand_chacha",
    "dep:rand_core",
    "dep:secp256k1",
    "zcash_primitives/transparent-inputs",
    "dep:zcash_proofs",
    # Mock prover fallback (placeholder proofs) when no Sapling parameters are supplied.
    "sapling/test-dependencies",
    "zcash_primitives/non-standard-fees",
    "zcash_protocol/local-consensus",
]

# ZIP 258 closes Orchard at NU6.3; this builds pre-activation Orchard notes for ZIP 318 migration.
orchard-tx-build = [
    "dep:secp256k1",
    "dep:sapling",
    "dep:jubjub",
    "dep:bls12_381",
    "dep:rand",
    "dep:rand_core",
    "dep:rand_chacha",
    "dep:orchard",
    "zcash_primitives/transparent-inputs",
    "zcash_primitives/non-standard-fees",
    "zcash_protocol/local-consensus",
]

ironwood-tx-build = [
    "dep:secp256k1",
    "dep:sapling",
    "dep:jubjub",
    "dep:bls12_381",
    "dep:rand",
    "dep:rand_core",
    "dep:rand_chacha",
    "dep:orchard",
    "dep:incrementalmerkletree",
    "dep:zcash_proofs",
    "zcash_primitives/transparent-inputs",
    "zcash_primitives/non-standard-fees",
    "zcash_protocol/local-consensus",
]

[dev-dependencies]
sapling = { package = "sapling-crypto", version = "0.9" }
zcash_client_backend = { version = "0.25.0", features = ["orchard", "test-dependencies"] }
orchard = { version = "0.16.0", features = ["test-dependencies"] }
zcash_note_encryption = "0.5.1"
rand = "0.10"
