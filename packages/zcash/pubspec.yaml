name: zcash
description: >-
  Pure Dart Zcash models and node clients for Zebra and zcashd JSON-RPC and
  lightwalletd gRPC, plus the wallet value objects shared with zcash_flutter.
version: 0.0.8
repository: https://github.com/ManyMath/zcash/tree/main/packages/zcash
issue_tracker: https://github.com/ManyMath/zcash/issues
topics:
  - zcash
  - cryptocurrency
  - wallet
  - lightwalletd
  - json-rpc

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  http: ^1.6.0
  fixnum: ^1.1.0
  grpc: ^5.1.0
  protobuf: ^6.0.0
  crypto: ^3.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.27.0
