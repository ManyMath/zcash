name: zcash_flutter
description: >-
  Zcash wallet operations for Flutter and Dart over the bundled zcash-ffi
  Rust crate: key derivation, compact-block scanning, transaction building
  and lightwalletd sync, with the zcash_tool CLI.
version: 0.0.1
repository: https://github.com/ManyMath/zcash/tree/main/packages/zcash_flutter
issue_tracker: https://github.com/ManyMath/zcash/issues
topics:
  - zcash
  - cryptocurrency
  - wallet
  - ffi
  - native-assets

executables:
  zcash_tool:

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  zcash: ^0.0.8
  ffi: ^2.1.0
  hooks: ^1.0.2
  code_assets: ^1.0.0
  path: ^1.9.0

dev_dependencies:
  crypto: ^3.0.0
  fixnum: ^1.1.0
  grpc: ^5.1.0
  http: ^1.6.0
  lints: ^6.0.0
  test: ^1.27.0
