name: zcash_flutter_example
description: "Runs the zcash_flutter wallet surface on a device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  zcash_flutter:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

# zcash_flutter depends on the hosted zcash package; point it at the checkout so
# the example builds against the same tree.
dependency_overrides:
  zcash:
    path: ../../zcash
