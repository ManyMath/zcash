name: zcash_flutter_example
description: "Runs the zcash_ffi wallet surface on a device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  zcash_ffi:
    path: ../../packages/zcash_ffi

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

# cargokit's build_tool pins exact http/path versions, and a package's
# overrides do not reach its consumers, so each app repeats these.
dependency_overrides:
  http: ^1.6.0
  path: ^1.9.0
